name: sync desktop skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: sync-desktop-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: check out marketplace
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}

      - name: check out source skills
        uses: actions/checkout@v4
        with:
          repository: nextdata-tech/nexty-agent-skills
          token: ${{ secrets.NEXTY_AGENT_SKILLS_TOKEN }}
          path: .source/nexty-agent-skills
          submodules: recursive

      - name: test synchronization
        run: bash scripts/test-sync-from-source.sh

      - name: synchronize Desktop skills
        run: bash scripts/sync-from-source.sh .source/nexty-agent-skills

      - name: commit synchronized marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          SYNC_BRANCH: automation/nexty-desktop-skills
        run: |
          git config user.name "nexty-marketplace-sync"
          git config user.email "nexty-marketplace-sync@users.noreply.github.com"
          find_sync_pr() {
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$SYNC_BRANCH" \
              --base main \
              --state open \
              --json url,isCrossRepository,headRepositoryOwner \
              --jq 'map(select(.isCrossRepository == false and .headRepositoryOwner.login == env.GITHUB_REPOSITORY_OWNER)) | .[0].url // empty'
          }
          git add .claude-plugin plugins
          if git diff --cached --quiet; then
            pr_url="$(find_sync_pr)"
            if [[ -n "$pr_url" ]]; then
              gh pr close "$pr_url" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Generated marketplace content is already current on main."
            fi
            if git ls-remote --exit-code --heads origin "${SYNC_BRANCH}" >/dev/null 2>&1; then
              git push origin --delete "${SYNC_BRANCH}"
            fi
            echo "marketplace is already current"
            exit 0
          fi
          if git fetch origin "${SYNC_BRANCH}" >/dev/null 2>&1 && \
            git diff --cached --quiet FETCH_HEAD -- .claude-plugin plugins; then
            echo "automation branch already contains the current marketplace"
          else
            git commit -m "chore: sync nexty desktop skills"
            git push --force origin "HEAD:${SYNC_BRANCH}"
          fi
          pr_url="$(find_sync_pr)"
          if [[ -n "$pr_url" ]]; then
            echo "updated ${pr_url}"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync nexty desktop skills" \
              --body "Automated synchronization from the private nexty-agent-skills source repository."
          fi
